<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitob qo‘shish — Admin | EDUKITOB</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body data-mode="add">
  <header class="site-header">
    <div class="container header-inner">
      <div class="flex items-center gap-1">
        <button class="icon-btn mobile-toggle" id="admin-menu-toggle" type="button" aria-label="Menyu">☰</button>
        <a class="brand" href="/admin/index.html">
          <svg class="logo" viewBox="0 0 34 34" fill="none" aria-hidden="true"><rect x="3" y="5" width="20" height="24" rx="3" fill="#2f80ed"/><rect x="11" y="7" width="20" height="24" rx="3" fill="#1f3c5d"/><path d="M16 14h10M16 19h10M16 24h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
          EDU<b>KITOB</b>
        </a>
        <span class="role-badge admin">Admin</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" data-theme-toggle type="button" aria-label="Rejimni almashtirish"><span class="theme-icon">☾</span></button>
        <span id="admin-user-name" class="muted" style="font-size:14px"></span>
        <button class="btn btn-outline btn-sm" id="admin-logout" type="button">Chiqish</button>
      </div>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="group-title">Boshqaruv</div>
      <a href="/admin/index.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <a href="/admin/statistics.html"><i class="fa-solid fa-chart-line"></i> Statistika</a>
      <a href="/admin/audit.html"><i class="fa-solid fa-clipboard-list"></i> Audit jurnali</a>
      <div class="group-title">Kitoblar</div>
      <a href="/admin/books.html"><i class="fa-solid fa-book"></i> Barcha kitoblar</a>
      <a href="/admin/add-book.html"><i class="fa-solid fa-plus"></i> Kitob qo‘shish</a>
      <a href="/admin/tools.html"><i class="fa-solid fa-file-import"></i> Ommaviy yuklash / Import</a>
      <div class="group-title">Platforma</div>
      <a href="/admin/subjects.html"><i class="fa-solid fa-layer-group"></i> Fanlar va tillar</a>
      <a href="/admin/tests.html"><i class="fa-solid fa-clipboard-question"></i> Testlar</a>
      <a href="/admin/users.html"><i class="fa-solid fa-users"></i> Foydalanuvchilar</a>
      <a href="/admin/settings.html"><i class="fa-solid fa-gear"></i> Sozlamalar</a>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <h1>Yangi kitob qo‘shish</h1>
        <a class="btn btn-outline" href="/admin/books.html">← Kitoblar</a>
      </div>

      <form id="book-form" class="admin-card" novalidate>
        <div class="form-row">
          <div class="flex-1">
            <label for="title">Kitob nomi *</label>
            <input type="text" id="title" required maxlength="250" placeholder="Masalan: Matematika 5-sinf">
          </div>
          <div>
            <label for="category">Adabiyot turi *</label>
            <select id="category" required><option value="">Tanlang...</option></select>
          </div>
        </div>

        <div class="form-row">
          <div>
            <label for="class">Sinf</label>
            <select id="class"><option value="">—</option></select>
          </div>
          <div>
            <label for="subject">Fan</label>
            <select id="subject"><option value="">—</option></select>
          </div>
          <div>
            <label for="language">Til</label>
            <select id="language"><option value="">—</option></select>
          </div>
          <div style="max-width:130px">
            <label for="year">Nashr yili</label>
            <input type="number" id="year" min="1400" max="2100" placeholder="2026">
          </div>
        </div>

        <div class="form-row">
          <div class="flex-1">
            <label for="author">Muallif</label>
            <input type="text" id="author" maxlength="200">
          </div>
          <div class="flex-1">
            <label for="publisher">Nashriyot</label>
            <input type="text" id="publisher" maxlength="200">
          </div>
        </div>

        <div class="mb-2">
          <label for="description">Tavsif</label>
          <textarea id="description" rows="3" maxlength="2000"></textarea>
        </div>

        <div class="form-row">
          <div class="flex-1">
            <label for="pdf">PDF fayl *</label>
            <input type="file" id="pdf" accept="application/pdf,.pdf">
            <div class="muted mt-1">Faqat haqiqiy PDF. Hozirgi limit: server sozlamasiga bog‘liq.</div>
          </div>
          <div class="flex-1">
            <label for="cover">Muqova rasmi (ixtiyoriy)</label>
            <input type="file" id="cover" accept="image/jpeg,image/png,image/webp,.jpg,.jpeg,.png,.webp">
            <img id="cover-preview" class="cover-preview mt-1" alt="" hidden>
          </div>
        </div>

        <div class="mb-2 flex gap-2 flex-wrap">
          <label class="flex items-center gap-1" style="cursor:pointer">
            <input type="checkbox" id="allow-download" checked> Yuklab olishga ruxsat berish
          </label>
          <label class="flex items-center gap-1" style="cursor:pointer">
            <input type="checkbox" id="is-published"> Darhol ommaga chiqarish
          </label>
        </div>

        <div id="form-error" class="status-badge red mb-2" style="display:none"></div>

        <div class="progress-track mb-2" id="progress-wrap" style="display:none">
          <div class="progress-fill" id="progress-fill" style="width:0%"></div>
        </div>

        <div class="flex gap-1">
          <button type="submit" class="btn btn-primary" id="submit-btn">Saqlash</button>
          <a class="btn btn-ghost" href="/admin/books.html">Bekor qilish</a>
        </div>
      </form>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/admin/book-form.js"></script>
</body>
</html>
