<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirish — Admin panel | EDUKITOB</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="login-admin-wrap">
    <div class="login-admin-card">
      <div style="text-align:center;margin-bottom:22px">
        <svg style="width:52px;height:52px" viewBox="0 0 34 34" fill="none" aria-hidden="true"><rect x="3" y="5" width="20" height="24" rx="3" fill="#2f80ed"/><rect x="11" y="7" width="20" height="24" rx="3" fill="#1f3c5d"/><path d="M16 14h10M16 19h10M16 24h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
        <h1 style="font-size:21px;margin:10px 0 4px">EDUKITOB Admin</h1>
        <p class="muted" style="margin:0">Boshqaruv paneliga kirish</p>
      </div>

      <form id="login-form" novalidate>
        <div class="mb-2">
          <label for="email">Login yoki elektron pochta</label>
          <input type="email" id="email" name="email" autocomplete="username" required placeholder="admin@edukitob.uz">
        </div>
        <div class="mb-2">
          <label for="password">Parol</label>
          <div class="flex gap-1">
            <input type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••" style="flex:1">
            <button type="button" class="btn btn-outline" id="toggle-pass" aria-label="Parolni ko‘rsatish">👁</button>
          </div>
        </div>
        <div id="error-box" class="status-badge red" style="display:none;width:100%;text-align:center;padding:9px;margin-bottom:14px"></div>
        <button type="submit" class="btn btn-primary w-100" id="submit-btn">Kirish</button>
      </form>

      <p class="muted mt-3" style="text-align:center">
        <a href="/index.html" style="color:inherit">← Saytga qaytish</a>
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/admin-login.js"></script>
</body>
</html>
