<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fanlar va tillar — Admin | EDUKITOB</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="flex items-center gap-1">
        <button class="icon-btn mobile-toggle" id="admin-menu-toggle" type="button" aria-label="Menyu">☰</button>
        <a class="brand" href="/admin/index.html">
          <svg class="logo" viewBox="0 0 34 34" fill="none" aria-hidden="true"><rect x="3" y="5" width="20" height="24" rx="3" fill="#2f80ed"/><rect x="11" y="7" width="20" height="24" rx="3" fill="#1f3c5d"/><path d="M16 14h10M16 19h10M16 24h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
          EDU<b>KITOB</b>
        </a>
        <span class="role-badge admin">Admin</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" data-theme-toggle type="button" aria-label="Rejimni almashtirish"><span class="theme-icon">☾</span></button>
        <span id="admin-user-name" class="muted" style="font-size:14px"></span>
        <button class="btn btn-outline btn-sm" id="admin-logout" type="button">Chiqish</button>
      </div>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="group-title">Boshqaruv</div>
      <a href="/admin/index.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <a href="/admin/statistics.html"><i class="fa-solid fa-chart-line"></i> Statistika</a>
      <a href="/admin/audit.html"><i class="fa-solid fa-clipboard-list"></i> Audit jurnali</a>
      <div class="group-title">Kitoblar</div>
      <a href="/admin/books.html"><i class="fa-solid fa-book"></i> Barcha kitoblar</a>
      <a href="/admin/add-book.html"><i class="fa-solid fa-plus"></i> Kitob qo‘shish</a>
      <a href="/admin/tools.html"><i class="fa-solid fa-file-import"></i> Ommaviy yuklash / Import</a>
      <div class="group-title">Platforma</div>
      <a href="/admin/subjects.html"><i class="fa-solid fa-layer-group"></i> Fanlar va tillar</a>
      <a href="/admin/tests.html"><i class="fa-solid fa-clipboard-question"></i> Testlar</a>
      <a href="/admin/users.html"><i class="fa-solid fa-users"></i> Foydalanuvchilar</a>
      <a href="/admin/settings.html"><i class="fa-solid fa-gear"></i> Sozlamalar</a>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <h1>Fanlar, adabiyot turlari va tillar</h1>
      </div>

      <div class="flex gap-2 flex-wrap" style="align-items:flex-start">
        <!-- Fanlar -->
        <div class="admin-card flex-1" style="min-width:300px">
          <h2>Fanlar</h2>
          <div class="flex gap-1 mb-2">
            <input type="text" id="s-name" placeholder="Fan nomi" maxlength="80" class="flex-1">
            <button class="btn btn-primary" id="s-add" type="button">Qo‘shish</button>
          </div>
          <div id="s-list"></div>
        </div>

        <!-- Adabiyot turlari -->
        <div class="admin-card flex-1" style="min-width:300px">
          <h2>Adabiyot turlari</h2>
          <div class="flex gap-1 mb-2">
            <input type="text" id="c-name" placeholder="Tur nomi (masalan: Darslik)" maxlength="80" class="flex-1">
            <button class="btn btn-primary" id="c-add" type="button">Qo‘shish</button>
          </div>
          <div id="c-list"></div>
        </div>

        <!-- Tillar -->
        <div class="admin-card flex-1" style="min-width:300px">
          <h2>Tillar</h2>
          <div class="flex gap-1 mb-2">
            <input type="text" id="l-code" placeholder="kod (uz)" maxlength="8" style="width:90px">
            <input type="text" id="l-name" placeholder="Nomi (O‘zbekcha)" maxlength="50" class="flex-1">
            <button class="btn btn-primary" id="l-add" type="button">Qo‘shish</button>
          </div>
          <div id="l-list"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/admin/taxonomy.js"></script>
</body>
</html>
