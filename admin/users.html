<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foydalanuvchilar — Admin | EDUKITOB</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="flex items-center gap-1">
        <button class="icon-btn mobile-toggle" id="admin-menu-toggle" type="button" aria-label="Menyu">☰</button>
        <a class="brand" href="/admin/index.html">
          <svg class="logo" viewBox="0 0 34 34" fill="none" aria-hidden="true"><rect x="3" y="5" width="20" height="24" rx="3" fill="#2f80ed"/><rect x="11" y="7" width="20" height="24" rx="3" fill="#1f3c5d"/><path d="M16 14h10M16 19h10M16 24h6" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg>
          EDU<b>KITOB</b>
        </a>
        <span class="role-badge admin">Admin</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" data-theme-toggle type="button" aria-label="Rejimni almashtirish"><span class="theme-icon">☾</span></button>
        <span id="admin-user-name" class="muted" style="font-size:14px"></span>
        <button class="btn btn-outline btn-sm" id="admin-logout" type="button">Chiqish</button>
      </div>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar" id="admin-sidebar">
      <div class="group-title">Boshqaruv</div>
      <a href="/admin/index.html"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <a href="/admin/statistics.html"><i class="fa-solid fa-chart-line"></i> Statistika</a>
      <a href="/admin/audit.html"><i class="fa-solid fa-clipboard-list"></i> Audit jurnali</a>
      <div class="group-title">Kitoblar</div>
      <a href="/admin/books.html"><i class="fa-solid fa-book"></i> Barcha kitoblar</a>
      <a href="/admin/add-book.html"><i class="fa-solid fa-plus"></i> Kitob qo‘shish</a>
      <a href="/admin/tools.html"><i class="fa-solid fa-file-import"></i> Ommaviy yuklash / Import</a>
      <div class="group-title">Platforma</div>
      <a href="/admin/subjects.html"><i class="fa-solid fa-layer-group"></i> Fanlar va tillar</a>
      <a href="/admin/tests.html"><i class="fa-solid fa-clipboard-question"></i> Testlar</a>
      <a href="/admin/users.html"><i class="fa-solid fa-users"></i> Foydalanuvchilar</a>
      <a href="/admin/settings.html"><i class="fa-solid fa-gear"></i> Sozlamalar</a>
    </aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <h1>Foydalanuvchilar</h1>
        <button class="btn btn-primary" id="add-toggle" type="button">+ Foydalanuvchi qo‘shish</button>
      </div>

      <form class="admin-card" id="add-form" hidden novalidate>
        <h2 style="margin-top:0">Yangi foydalanuvchi</h2>
        <div class="form-row">
          <div class="flex-1">
            <label for="u-name">To‘liq ism *</label>
            <input type="text" id="u-name" maxlength="120" required>
          </div>
          <div class="flex-1">
            <label for="u-email">Email *</label>
            <input type="email" id="u-email" required>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label for="u-role">Rol</label>
            <select id="u-role">
              <option value="student">O‘quvchi</option>
              <option value="teacher">O‘qituvchi</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="flex-1">
            <label for="u-pass">Parol *</label>
            <input type="text" id="u-pass" placeholder="Kamida 8 belgi" required autocomplete="off">
          </div>
        </div>
        <div id="u-error" class="status-badge red mb-2" style="display:none"></div>
        <button type="submit" class="btn btn-primary">Saqlash</button>
      </form>

      <div class="toolbar-row">
        <input type="search" id="f-q" placeholder="Ism yoki email...">
        <select id="f-role">
          <option value="">Barcha rollar</option>
          <option value="student">O‘quvchi</option>
          <option value="teacher">O‘qituvchi</option>
          <option value="admin">Admin</option>
        </select>
        <select id="f-status">
          <option value="">Barcha holatlar</option>
          <option value="active">Faol</option>
          <option value="blocked">Bloklangan</option>
        </select>
        <button class="btn btn-primary" id="f-apply" type="button">Filtr</button>
      </div>

      <div class="table-wrap">
        <table class="data" id="users-table">
          <thead>
            <tr>
              <th>Foydalanuvchi</th>
              <th>Email</th>
              <th>Rol</th>
              <th>Holat</th>
              <th>Ro‘yxatdan o‘tgan</th>
              <th style="width:300px"></th>
            </tr>
          </thead>
          <tbody>
            <tr><td colspan="6"><div class="spinner" style="margin:14px auto"></div></td></tr>
          </tbody>
        </table>
      </div>
      <div id="pager" class="mt-2"></div>
    </main>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/admin.js"></script>
  <script src="/js/admin/users.js"></script>
</body>
</html>
