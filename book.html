<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitob — EDUKITOB</title>
  <meta name="description" content="Kitob haqida batafsil ma’lumot, onlayn o‘qish va PDF yuklab olish.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-app-chrome>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/index.html">
        <span class="logo-badge"><i class="fa-solid fa-book-open" aria-hidden="true"></i></span>
        EDU<b>KITOB</b>
      </a>
      <nav class="main-nav" id="main-nav" aria-label="Asosiy menyu">
        <a href="/index.html" title="Bosh sahifa" aria-label="Bosh sahifa"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Bosh sahifa</span></a>
        <a href="/library.html" title="Kutubxona" aria-label="Kutubxona"><i class="fa-solid fa-book-open" aria-hidden="true"></i><span>Kutubxona</span></a>
        <a href="/books.html" title="Barcha kitoblar" aria-label="Barcha kitoblar"><i class="fa-solid fa-book" aria-hidden="true"></i><span>Barcha kitoblar</span></a>
        <a href="/tests.html" title="Testlar" aria-label="Testlar"><i class="fa-solid fa-clipboard-question" aria-hidden="true"></i><span>Testlar</span></a>
        <a href="/about.html" title="Sayt haqida" aria-label="Sayt haqida"><i class="fa-solid fa-circle-info" aria-hidden="true"></i><span>Sayt haqida</span></a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" data-theme-toggle type="button" aria-label="Rejimni almashtirish"><span class="theme-icon"><i class="fa-solid fa-moon" aria-hidden="true"></i></span></button>
        <button class="icon-btn mobile-toggle" id="mobile-toggle" type="button" aria-label="Menyu"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        <div id="auth-slot" style="display:flex;gap:8px"></div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="crumbs" id="crumbs"><a href="/index.html">Bosh sahifa</a><span class="sep">›</span><a href="/library.html">Kutubxona</a></div>

    <div id="book-wrap" class="hidden" style="margin-top:10px">
      <div style="display:flex;gap:28px;flex-wrap:wrap">
        <div style="flex:0 0 220px;max-width:220px">
          <div class="book-cover" id="book-cover" style="border-radius:14px;border:1px solid var(--border)"></div>
          <div style="display:flex;flex-direction:column;gap:8px;margin-top:14px">
            <a class="btn btn-primary" id="btn-read" href="#">Onlayn o‘qish</a>
            <button class="btn btn-outline" id="btn-download" type="button">PDF yuklab olish</button>
            <button class="btn btn-ghost" id="btn-favorite" type="button">♥ Sevimlilarga</button>
            <button class="btn btn-ghost" id="btn-share" type="button">Ulashish / QR-kod</button>
          </div>
        </div>
        <div style="flex:1;min-width:280px">
          <h1 id="book-title" style="font-size:27px;margin:0 0 8px"></h1>
          <div id="book-tags" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px"></div>
          <table style="border-collapse:collapse;font-size:14.5px;max-width:560px">
            <tbody id="book-info"></tbody>
          </table>
          <h3 style="margin-top:24px">Kitob haqida</h3>
          <p id="book-description" class="muted" style="max-width:640px"></p>
        </div>
      </div>
    </div>

    <div id="book-error" class="empty-state hidden" style="margin-top:30px">
      <div class="icon">📕</div>
      <p id="book-error-text">Kitob topilmadi</p>
      <a class="btn btn-primary" href="/library.html">Kutubxonaga qaytish</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© <span id="footer-year"></span> EDUKITOB</span>
        <span><a href="/privacy.html"><i class="fa-solid fa-angle-right" aria-hidden="true"></i>Maxfiylik siyosati</a> · <a href="/contact.html"><i class="fa-solid fa-angle-right" aria-hidden="true"></i>Aloqa</a></span>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/download.js"></script>
  <script src="/js/book-details.js"></script>
</body>
</html>
