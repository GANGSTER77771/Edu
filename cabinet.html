<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kabinetim — EDUKITOB</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/tests.css">
</head>
<body data-app-chrome>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/index.html">
        <span class="logo-badge"><i class="fa-solid fa-book-open" aria-hidden="true"></i></span>
        EDU<b>KITOB</b>
      </a>
      <nav class="main-nav" id="main-nav" aria-label="Asosiy menyu">
        <a href="/index.html" title="Bosh sahifa" aria-label="Bosh sahifa"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Bosh sahifa</span></a>
        <a href="/library.html" title="Kutubxona" aria-label="Kutubxona"><i class="fa-solid fa-book-open" aria-hidden="true"></i><span>Kutubxona</span></a>
        <a href="/books.html" title="Barcha kitoblar" aria-label="Barcha kitoblar"><i class="fa-solid fa-book" aria-hidden="true"></i><span>Barcha kitoblar</span></a>
        <a href="/tests.html" title="Testlar" aria-label="Testlar"><i class="fa-solid fa-clipboard-question" aria-hidden="true"></i><span>Testlar</span></a>
        <a href="/about.html" title="Sayt haqida" aria-label="Sayt haqida"><i class="fa-solid fa-circle-info" aria-hidden="true"></i><span>Sayt haqida</span></a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" data-theme-toggle type="button" aria-label="Rejimni almashtirish"><span class="theme-icon"><i class="fa-solid fa-moon" aria-hidden="true"></i></span></button>
        <button class="icon-btn mobile-toggle" id="mobile-toggle" type="button" aria-label="Menyu"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        <div id="auth-slot" style="display:flex;gap:8px"></div>
      </div>
    </div>
  </header>

  <main class="container">
    <h1 style="font-size:26px;margin:24px 0 6px" id="hello">Kabinetim</h1>
    <p class="muted" style="margin:0 0 24px">O‘qish tarixi, sevimlilar va test natijalaringiz bir joyda.</p>

    <section class="admin-card">
      <h2 style="font-size:18px">Test kodini kiriting</h2>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <input class="code-input" type="text" id="test-code" maxlength="16" placeholder="MASALAN: TEST2345" style="flex:1;min-width:220px">
        <button class="btn btn-primary" id="join-btn" type="button">Testni ochish</button>
      </div>
      <div id="join-info" class="mt-2"></div>
    </section>

    <section class="admin-card">
      <h2 style="font-size:18px">O‘qishni davom ettirish</h2>
      <div id="continue-list" class="books-grid"></div>
    </section>

    <section class="admin-card">
      <h2 style="font-size:18px">Sevimlilar</h2>
      <div id="favorites-list" class="books-grid"></div>
    </section>

    <section class="admin-card">
      <h2 style="font-size:18px">Test natijalarim</h2>
      <div class="table-wrap">
        <table class="data" id="attempts-table">
          <thead>
            <tr><th>Test</th><th>Sana</th><th>Holat</th><th>Natija</th><th>Vaqt</th><th></th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© <span id="footer-year"></span> EDUKITOB</span>
        <span><a href="/privacy.html"><i class="fa-solid fa-angle-right" aria-hidden="true"></i>Maxfiylik siyosati</a></span>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/cabinet.js"></script>
</body>
</html>
