<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kirish — EDUKITOB</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body data-app-chrome>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/index.html">
        <span class="logo-badge"><i class="fa-solid fa-book-open" aria-hidden="true"></i></span>
        EDU<b>KITOB</b>
      </a>
      <div class="header-actions">
        <button class="icon-btn" data-theme-toggle type="button" aria-label="Rejimni almashtirish"><span class="theme-icon"><i class="fa-solid fa-moon" aria-hidden="true"></i></span></button>
      </div>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="form-card">
      <h1 style="font-size:22px;margin:0 0 4px">Tizimga kirish</h1>
      <p class="muted" style="margin:0 0 18px">Akkauntingizga kirib, kitoblar tarixi va testlarda qatnashing.</p>
      <div class="form-error hidden" id="login-error" role="alert"></div>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label for="password">Parol</label>
          <div class="pass-wrap">
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button class="pass-toggle" type="button" id="pass-toggle" aria-label="Parolni ko‘rsatish">👁</button>
          </div>
        </div>
        <button class="btn btn-primary btn-block" type="submit" id="submit-btn">Kirish</button>
      </form>
      <p class="muted" style="text-align:center;margin:16px 0 0">Akkauntingiz yo‘qmi? <a href="/register.html">Ro‘yxatdan o‘tish</a></p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
