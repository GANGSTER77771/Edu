<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test natijalari — EDUKITOB</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/tests.css">
</head>
<body data-app-chrome>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/index.html">
        <span class="logo-badge"><i class="fa-solid fa-book-open" aria-hidden="true"></i></span>
        EDU<b>KITOB</b>
      </a>
      <nav class="main-nav" id="main-nav" aria-label="Asosiy menyu">
        <a href="/index.html" title="Bosh sahifa" aria-label="Bosh sahifa"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Bosh sahifa</span></a>
        <a href="/library.html" title="Kutubxona" aria-label="Kutubxona"><i class="fa-solid fa-book-open" aria-hidden="true"></i><span>Kutubxona</span></a>
        <a href="/cabinet.html">Kabinetim</a>
        <a href="/teacher.html">O‘qituvchi</a>
      </nav>
      <div class="header-actions">
        <button class="icon-btn" data-theme-toggle type="button" aria-label="Rejimni almashtirish"><span class="theme-icon"><i class="fa-solid fa-moon" aria-hidden="true"></i></span></button>
        <button class="icon-btn mobile-toggle" id="mobile-toggle" type="button" aria-label="Menyu"><i class="fa-solid fa-bars" aria-hidden="true"></i></button>
        <div id="auth-slot" style="display:flex;gap:8px"></div>
      </div>
    </div>
  </header>

  <main class="container">
    <a class="back-link" href="/teacher.html">← Mening testlarim</a>
    <div id="guard" class="form-card" style="text-align:center;padding:40px"><div class="spinner" style="margin:0 auto"></div></div>

    <div id="content" hidden>
      <div class="test-head-card">
        <div class="test-head-main">
          <h1 id="t-title"></h1>
          <div class="test-head-meta" id="t-meta"></div>
        </div>
        <div class="test-head-code">
          <span class="code-label">Test kodi</span>
          <span class="test-code" id="t-code"></span>
        </div>
      </div>

      <div class="stat-mini-grid" id="stat-grid"></div>

      <div class="form-card mt-2">
        <h2 style="font-size:16px;margin-top:0">Savollar kesimida</h2>
        <div id="q-stats"></div>
      </div>

      <div class="admin-topbar mt-3">
        <h1 style="font-size:18px">O‘quvchilar natijalari</h1>
      </div>
      <div class="table-wrap">
        <table class="data" id="attempts-table">
          <thead>
            <tr><th>O‘quvchi</th><th>Email</th><th>Natija</th><th>Foiz</th><th>Vaqt</th><th>Topshirilgan</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div id="attempts-empty" class="form-card mt-2" style="text-align:center" hidden>
        <p class="muted" style="margin:0">Hozircha hech kim testni topshirmagan. Test kodini o‘quvchilarga ulashing.</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <span>© <span id="footer-year"></span> EDUKITOB</span>
      </div>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/teacher-results.js"></script>
</body>
</html>
