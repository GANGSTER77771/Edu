<!DOCTYPE html>
<html lang="uz" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Test topshirish — EDUKITOB</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
  <link rel="stylesheet" href="/css/tests.css">
</head>
<body data-app-chrome>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="/index.html">
        <span class="logo-badge"><i class="fa-solid fa-book-open" aria-hidden="true"></i></span>
        EDU<b>KITOB</b>
      </a>
      <div class="header-actions">
        <button class="icon-btn" data-theme-toggle type="button" aria-label="Rejimni almashtirish"><span class="theme-icon"><i class="fa-solid fa-moon" aria-hidden="true"></i></span></button>
      </div>
    </div>
  </header>

  <div class="test-layout">
    <div class="test-header">
      <h1 id="test-title">Yuklanmoqda...</h1>
      <div style="display:flex;align-items:center;gap:12px">
        <div id="answered-count" class="muted"></div>
        <div class="timer-box hidden" id="timer">--:--</div>
      </div>
    </div>

    <div id="test-body"></div>

    <div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap">
      <button class="btn btn-primary" id="submit-btn" type="button" style="flex:1;min-width:220px">Testni yakunlash va topshirish</button>
    </div>
    <p class="muted mt-1" style="font-size:13px">Topshirgandan so‘ng javoblarni o‘zgartirib bo‘lmaydi.</p>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/test-taking.js"></script>
</body>
</html>
